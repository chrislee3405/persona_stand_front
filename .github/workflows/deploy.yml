name: Test and publish frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Validation works on feature branches and fork PRs without secrets.
      # Published images use the real repository setting in a separate job.
      VITE_CDN_BASE: https://cdn.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Check code quality
        run: npm run lint
      - name: Run frontend behavior tests
        run: npm run test:ci
      - name: Type-check and build the application
        run: npm run build
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/
          if-no-files-found: ignore

  build-and-push:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serialize publication of the same commit, including workflow reruns.
    concurrency:
      group: ghcr-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Check publish-once safeguards
        run: python3 -m unittest discover -s scripts -p test_publish_image.py
      - name: Publish once or reuse the existing commit image
        env:
          VITE_CDN_BASE: ${{ vars.VITE_CDN_BASE }}
        run: python3 scripts/publish_image.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-image-${{ github.sha }}
          path: image.json
          retention-days: 90
