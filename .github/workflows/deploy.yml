name: Test and publish frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Validation works on feature branches and fork PRs without secrets.
      # Published images use the real repository setting in a separate job.
      VITE_CDN_BASE: https://cdn.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Check code quality
        run: npm run lint
      - name: Run frontend behavior tests
        run: npm run test:ci
      - name: Type-check and build the application
        run: npm run build
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/
          if-no-files-found: ignore

  build-and-push:
    needs: checks
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'trial')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish candidate image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          VITE_CDN_BASE: ${{ vars.VITE_CDN_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_CDN_BASE:-}" ]; then
            echo "::error::Set the VITE_CDN_BASE repository variable before publishing."
            exit 1
          fi
          printf 'VITE_CDN_BASE=%s\n' "$VITE_CDN_BASE" > .env
          docker build \
            --label "org.opencontainers.image.revision=$IMAGE_TAG" \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG"
