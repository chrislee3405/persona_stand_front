# Security headers, defined once and applied in EVERY location block.
#
# They used to sit at server level only. nginx inherits `add_header` from
# the enclosing level ONLY IF the current level declares none of its own --
# so the static-asset block below, which sets its own Cache-Control,
# silently cancelled all of them for every .js, .css, image and font. The
# one that matters most on a script response, X-Content-Type-Options, was
# exactly the one being dropped.
#
# There is no `include`-able way to say "and also inherit"; repeating the
# set per location is the idiomatic fix short of the third-party
# headers-more module. Keep the three copies in step.
#
# X-XSS-Protection is deliberately NOT here any more: it is a no-op in
# every current browser and was withdrawn because it could introduce
# vulnerabilities of its own.

# Per-client request rate for /api/, enforced before a request reaches the
# backend. This file is included inside nginx's `http {}` block, which is the
# only context limit_req_zone is allowed in -- hence out here, above `server`.
#
# A coarse outer fence, not the real limits. The backend's own limits (per
# session and per IP pending caps, daily quotas, the invite-code failure
# breaker) are finer and durable; this exists so a flood is turned away by
# nginx for almost nothing, instead of each request costing a Python worker
# a database round trip just to be refused. Generous on purpose: a page load
# makes two or three /api/ calls, a chat turn one.
#
# Keyed on $binary_remote_addr, i.e. the TCP peer. That is the real client
# today, because nothing sits in front of this container. If a CDN or load
# balancer is ever put in front, the peer becomes THAT, every visitor shares
# one bucket, and this must switch to the forwarded client address (see
# set_real_ip_from in get_client_ip's docstring,
# persona_stand_back/app/dependencies/session.py).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
    # No nginx version in the Server header or on error pages -- it tells an
    # attacker exactly which CVEs to try, and tells a visitor nothing.
    server_tokens off;

    # 8080, not 80. The container runs nginx as the non-root `nginx` user
    # (see the frontend Dockerfile), and binding a port below 1024 needs a
    # capability the container does not have. Both compose files publish
    # "80:8080", so the site is still on :80 for a visitor.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required by the variable-based proxy_pass
    # below -- see the note in `location /api/`.
    #
    # 127.0.0.11 exists ONLY on a user-defined Docker network, which both
    # compose files give this container. Under host networking, Kubernetes or
    # ECS awsvpc there is nothing listening there, and the failure is silent:
    # nginx still starts, the static site still serves, and every /api/ call
    # returns 502. Moving to any of those means changing this line to that
    # platform's resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Catch ALL requests starting with /api/ and send them to FastAPI
    location /api/ {
        # Rate fence (zone defined above `server`). burst absorbs a normal
        # page load arriving all at once; nodelay serves that burst
        # immediately instead of spacing it out. Anything past it is refused
        # with 429 -- the same status the backend uses for its own limits, so
        # the frontend's existing 429 handling covers both.
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req_status 429;

        # The largest legitimate body any endpoint accepts is a chat message
        # (750 characters) or the consent echo (a policy's text, capped at 8 KB
        # by the backend's own model). nginx's default is 1 MB, which meant a
        # megabyte of JSON was read and buffered just to reach a length check.
        # 32 KB leaves ample headroom over both and refuses the rest at the
        # edge with 413.
        client_max_body_size 32k;

        # The upstream host goes through a VARIABLE on purpose. With a
        # literal `proxy_pass http://backend:8000/api/`, nginx resolves the
        # name at CONFIG-PARSE time and refuses to start if it does not
        # resolve:
        #     [emerg] host not found in upstream "backend"
        # `depends_on` in docker-compose waits for the backend to start, not
        # to stay up -- so a backend that crash-looped took the FRONTEND down
        # with it on the next restart, including the static portfolio that
        # needs no backend at all. An API outage became a total outage.
        # A variable defers resolution to request time: /api/ then returns
        # 502 while everything else keeps serving.
        set $backend_upstream http://backend:8000;
        # $request_uri, not a literal path. Once proxy_pass contains a
        # variable, nginx STOPS doing its automatic "replace the matched
        # location prefix" rewriting and sends exactly the URI written here
        # -- so `proxy_pass $backend_upstream/api/` would send every request
        # to /api/ and silently drop the rest of the path. $request_uri is
        # the original path AND query string, and the backend's routes are
        # already /api/..., so it maps one-to-one.
        proxy_pass $backend_upstream$request_uri;

        # No upstream keepalive, by consequence of the variable above: reusing
        # backend connections needs an `upstream { keepalive N; }` block, and
        # an upstream block resolves its servers at config-parse time -- the
        # exact startup coupling the variable exists to avoid. So each request
        # opens a fresh TCP connection to the backend, which on a
        # container-to-container hop at this traffic level costs well under a
        # millisecond. If traffic ever makes that matter, look at the `resolve`
        # parameter on an upstream server line (open-source nginx 1.27.3+),
        # and confirm nginx still starts with the backend down before
        # relying on it.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP is what the backend reads for rate limiting. nginx
        # OVERWRITES it with the real peer address, so a client cannot forge
        # it. X-Forwarded-For below is NOT safe for that purpose:
        # $proxy_add_x_forwarded_for APPENDS to whatever the client sent, so
        # its first element is attacker-controlled. See get_client_ip in
        # persona_stand_back/app/dependencies/session.py.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat turn makes 4-12 sequential model calls, so it needs a much
        # longer read timeout than the 60s default.
        #
        # KEEP THIS ABOVE TURN_DEADLINE_SECONDS in
        # persona_stand_back/app/constants.py (currently 100s). That deadline
        # is what actually bounds a turn now; this is the outer backstop, and
        # the ordering matters. When nginx timed out FIRST the backend did not
        # know: it finished the turn and committed the reply, so the visitor
        # got a 504 and was told their message was "Not sent", while the next
        # turn's history contained a persona reply they had never seen. The
        # backend gives up first now, and returns its own honest notice.
        #
        # The per-call ceiling (_REQUEST_TIMEOUT_MS in gemini_service.py) is a
        # different limit -- it bounds ONE hung connection, not a whole turn.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Let's Encrypt HTTP-01 challenge files. A `^~` prefix match, so it wins
    # over every regex location below -- including the hidden-file deny,
    # which would otherwise 403 anything under /.well-known/ and make
    # certificate issuance impossible without editing this file.
    #
    # Scoped to acme-challenge only; the rest of /.well-known/ stays denied.
    # Nothing is mounted at /var/www/certbot today, so this returns 404 until
    # the TLS work mounts certbot's webroot there.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Deny access to hidden files (.git, .env, ...). Declared BEFORE the
    # static-asset regex: nginx takes the FIRST regex location that matches,
    # so declared after it, a path like /.hidden/app.js matched the asset
    # block instead and was never denied.
    location ~ /\. {
        deny all;
    }

    # Serve static files with caching.
    #
    # `expires` and `add_header Cache-Control` were BOTH set here, emitting
    # two Cache-Control headers that browsers happened to concatenate into
    # something workable. That was a parsing accident, not a configuration.
    # One directive now, spelling out the whole policy.
    #
    # Only filenames Vite HASHES may be `immutable`. Everything under
    # /assets/ is hashed; the extensions below cover what it emits and the
    # media formats it would emit if one were imported (webp, avif, mp4,
    # webm, source maps). A new extension not listed here falls through to
    # `location /` and gets no-cache -- slower, never stale.
    location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA routing: fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;

        # The shell itself must NOT be cached: asset filenames are hashed, so
        # a stale index.html points at assets that no longer exist. It was
        # served with only ETag/Last-Modified, which lets an intermediary
        # cache it heuristically.
        add_header Cache-Control "no-cache" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content-Security-Policy. This site loads its own bundle, its own
        # inline styles, fonts bundled into the build, and images/video from
        # CloudFront -- nothing else. It also renders href values straight
        # out of a database, which is the reason a policy is worth having
        # even with React escaping the content.
        #
        # 'unsafe-inline' for styles only: the hero band and the chat
        # wallpaper are positioned with inline `style` attributes carrying
        # computed custom properties, which a nonce cannot cover. Scripts
        # have no such exemption.
        #
        # __CDN_BASE__ IS A BUILD-TIME PLACEHOLDER, substituted by the
        # Dockerfile from the same VITE_CDN_BASE that src/lib/assetUrl.ts and
        # index.html get. Do not paste a literal domain back in here: the
        # whole point is that one variable reaches all three, so the CSP
        # cannot silently start blocking every image and video on the site
        # after the distribution changes. (CSP violations are console-only --
        # nothing user-visible says why the page went blank of pictures.)
        #
        # If you are reading this file straight out of git, the placeholder is
        # what you should see. The built image has the real domain.
        #
        # connect-src includes the CDN because useMediaPrefetch warms the HTTP
        # cache for project clips and posters with fetch(), and fetch() is
        # governed by connect-src, not media-src/img-src. With 'self' alone
        # every prefetch was refused, silently -- the hook swallows errors by
        # design -- so the sheets buffered on open as if it did not exist.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: __CDN_BASE__; media-src 'self' __CDN_BASE__; font-src 'self' data:; connect-src 'self' __CDN_BASE__; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
