# http-level settings shared by both modes. Installed as
# /etc/nginx/conf.d/00-common.conf, so nginx's stock `include conf.d/*.conf`
# puts it inside `http {}` -- the only context limit_req_zone is allowed in,
# which is why it cannot live in ../nginx.conf (that file is included inside
# a `server {}`).

# No nginx version in the Server header or on error pages -- it tells an
# attacker exactly which CVEs to try, and tells a visitor nothing. Set here
# so it covers every server, including the HTTPS mode's redirect server.
server_tokens off;

# Per-client request rate for /api/, enforced before a request reaches the
# backend.
#
# A coarse outer fence, not the real limits. The backend's own limits (per
# session and per IP pending caps, daily quotas, the invite-code failure
# breaker) are finer and durable; this exists so a flood is turned away by
# nginx for almost nothing, instead of each request costing a Python worker
# a database round trip just to be refused. Generous on purpose: a page load
# makes two or three /api/ calls, a chat turn one.
#
# Keyed on $binary_remote_addr, i.e. the TCP peer. That is the real client
# in both modes, because HTTPS terminates in this container and nothing sits
# in front of it. If a CDN or load balancer is ever put in front, the peer
# becomes THAT, every visitor shares one bucket, and this must switch to the
# forwarded client address (see set_real_ip_from in get_client_ip's
# docstring, persona_stand_back/app/dependencies/session.py).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
