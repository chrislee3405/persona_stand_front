# PLAIN HTTP MODE -- the default. Installed as /etc/nginx/conf.d/default.conf
# at build time, and put back by select-mode.sh at every start unless
# TLS_DOMAIN is set. Used by local development, the combined browser tests,
# and EC2 before its certificate exists (the site then also serves certbot's
# challenge files, which is how the first certificate is issued).

# No HSTS over plain HTTP: browsers ignore it there, and an empty value makes
# nginx omit the header entirely. See the header notes in ../nginx.conf.
map $scheme $hsts_header {
    default "";
}

server {
    # 8080, not 80. The container runs nginx as the non-root `nginx` user
    # (see the frontend Dockerfile), and binding a port below 1024 needs a
    # capability the container does not have. The compose files publish
    # "80:8080", so the site is still on :80 for a visitor.
    listen 8080;
    listen [::]:8080;
    server_name _;

    include /etc/nginx/persona/site.conf;
}
